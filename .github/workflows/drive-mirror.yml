# Keeps Google Drive as a second source of truth (owner, 4 Oct): every push to GitHub, on any branch, is copied to the
# owner's Google Drive folder "Sparkle Valley", into "GitHub mirror/<branch>/" (the whole repository: game, voices,
# Studio, tests, documents; not the .git history). A file deleted in GitHub is deleted in that branch's mirror too.
#
# One-time setup (the owner; no key ever goes into the repository):
#   1. On any computer, install rclone (https://rclone.org/downloads/) and run:  rclone config
#      n (new remote) → name: gdrive → storage: drive → leave client id/secret empty → scope: 1 (full access)
#      → leave the rest as offered → "Use web browser to automatically authenticate?" y → sign in with the Google
#      account that owns the "Sparkle Valley" folder → not a shared drive → y (keep).
#   2. Run  rclone config file  to see where the config is, and copy that file's whole text.
#   3. GitHub → this repository → Settings → Secrets and variables → Actions → New repository secret:
#        RCLONE_CONF      = the text from step 2
#        DRIVE_FOLDER_ID  = the id of the Drive folder "Sparkle Valley" (the last part of its web address)
#   Until both secrets exist, this job only says it is not set up yet and passes.
name: Mirror to Google Drive
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drive-mirror-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - name: Set up yet?
        id: ready
        run: |
          if [ -z "$RCLONE_CONF" ] || [ -z "$DRIVE_FOLDER_ID" ]; then
            echo "Google Drive mirror is not set up yet (secrets RCLONE_CONF and DRIVE_FOLDER_ID): see the top of .github/workflows/drive-mirror.yml"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.go == 'yes'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.go == 'yes'
        name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - if: steps.ready.outputs.go == 'yes'
        name: Copy this branch to Drive
        run: |
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          REMOTE=$(rclone listremotes | head -n1)
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          rclone sync . "${REMOTE}GitHub mirror/${BRANCH}" --drive-root-folder-id "$DRIVE_FOLDER_ID" \
            --exclude ".git/**" --exclude "node_modules/**" --exclude "tests/out/**" \
            --transfers 8 --checkers 16 --fast-list --stats-one-line --stats 30s
          printf 'branch: %s\ncommit: %s\ndate: %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > MIRRORED-FROM.txt
          rclone copyto MIRRORED-FROM.txt "${REMOTE}GitHub mirror/${BRANCH}/MIRRORED-FROM.txt" --drive-root-folder-id "$DRIVE_FOLDER_ID"
