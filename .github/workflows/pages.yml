# Publishes the game to GitHub Pages (free hosting). Only started by hand (owner, 11 Oct AEDT): the game lives on
# Netlify and Pages is not switched on, so running on every merge into main only failed ("Get Pages site failed").
# To use it: GitHub repo → Settings → Pages → "Build and deployment" → Source: "GitHub Actions", then Actions → Run.
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
