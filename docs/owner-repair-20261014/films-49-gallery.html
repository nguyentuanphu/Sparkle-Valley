<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Point 49 film comparisons</title><style>body{margin:24px;background:#fff6e4;color:#3b2558;font:16px system-ui}h1{font-size:24px}label{display:inline-flex;gap:8px;align-items:center;margin:6px 16px 6px 0}select,button{min-height:44px;font:inherit;border-radius:8px;border:1px solid #ad9cc2;padding:8px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}img{display:block;max-width:100%;max-height:78vh;margin:auto;background:white}figcaption{font-weight:700;text-align:center;margin:12px}#note{max-width:1000px;line-height:1.5}a{color:#6634bb}@media(max-width:600px){body{margin:12px}main{grid-template-columns:1fr}}</style><h1>Point 49: story film comparisons</h1><p>BEFORE: supplied checkpoint c0bcd0bf. AFTER: film branch. These browser images sample static compositions; they do not prove physical-device behaviour or complete motion.</p><label>Story <select id="story"></select></label><label>Device <select id="device"><option>phone</option><option>tablet</option><option>computer</option></select></label><label>Language <select id="lang"><option value="en">English</option><option value="vi">Vietnamese</option></select></label><label>Picture <select id="picture"><option value="shell">Full screen, first page</option></select></label><p id="note"></p><main><figure><figcaption>BEFORE</figcaption><a id="beforeLink"><img id="before" alt="Story before the film changes"></a></figure><figure><figcaption>AFTER</figcaption><a id="afterLink"><img id="after" alt="Story after the film changes"></a></figure></main><p><a href="films-49.md">Work report and checks</a></p><script>const stories=[["duahau", "The First Watermelon", "Sandy island, moving sea, palms, white surf and distant sandbars; the royal homecoming keeps its palace."], ["thanhgiong", "Thánh Gióng", "A rice-growing village and bamboo groves, open horse-riding ground, then mountain rocks and clouds; journey scenes lose the generic house."], ["banhchung", "The Square Cake and the Round Cake", "Blossom-and-lantern royal New Year courtyard, distant mountain search, rice field and warm food-preparation setting."], ["caykhe", "The Starfruit Tree", "Fruit garden and two different household silhouettes; the gold-island scenes gain jewel-like treasure rocks, followed by an open sea journey."], ["hoguom", "The Returned Sword", "Lake and river banks with reeds, blossoms and a small pier; the boat, golden turtle and Turtle Tower stay central."], ["rongtien", "Children of the Dragon and the Fairy", "Coral and sea plants, flowering mountain rocks, coast and an open flower meadow for the eggs and family gathering."], ["caytre", "The Hundred-knot Bamboo", "Wide farm porch, stacked bamboo, bamboo grove and a flower-and-bunting wedding, retaining the joining bamboo action."], ["tamcam", "Tấm and Cám", "Garden home, lotus-side bank, lantern festival route, palace garden and golden-fruit orchard."], ["sodua", "The Coconut Shell Boy", "Modest hut, fenced goat pasture without a repeated house, wedding yard and a narrow study home with a reading desk."], ["thachsanh", "Thạch Sanh", "Forest clearing, soft rounded cave and cliff formations, a music clearing and rice-sharing setting, ending at a palace garden."], ["chucuoi", "Cuội and the Moon Tree", "Forest and herb garden around a modest hut, then the moon and stars; the existing rising magic tree remains the focus."], ["cockien", "Toad Asks for Rain", "Dry ground and rocks, a cloud palace with framing pavilions, then rain puddles; no repeated village house."], ["vusua", "The Milk Fruit Tree", "Warm family garden, rainy road, then a purple-fruit orchard; later garden scenes omit the generic home so the mother-tree stays central."], ["baluoiriu", "The Three Axes", "An open river between green banks, reeds and flowers on the far bank; the woodcutter and honest choice remain the focus."], ["quabau", "The Great Gourd", "Gourd-growing trellises and a modest hut, rain and flood, a flowering mountain refuge and an open family gathering."], ["thayboi", "The Friends and the Elephant", "An open shaded courtyard with stone bench and flowers, removing the repeated house behind the elephant."], ["nhacmeo", "Belling the Cat", "Mouse-height pantry shelves, jars, food and wooden floor; the room and mouse hole remain, with readable warm fill light."], ["ongtao", "The Kitchen Gods", "Warm kitchen shelves, carp-release garden, cloud court and a blossom-and-lantern New Year homecoming."], ["cachep", "The Carp and the Dragon Gate", "Rocky waterfall banks and reeds, then cloud-court details around the existing dragon transformation."], ["sontinh", "Mountain Spirit and Water Spirit", "Royal garden and pavilions, rounded mountain cliffs and rainy village setting; the flood and rising mountain actions remain."], ["rainbowserpent", "The Rainbow Serpent", "Open red-earth country and scattered rocks, preserving the quiet beginning, then rain and flowering waterhole banks as the land comes alive."], ["emu", "Why the Emu Cannot Fly", "Open grassland with pale branching gum trunks, airy crowns and yellow wildflowers; no village houses."], ["dotkangaroo", "Dot and the Kangaroo", "Warm dusk among pale-trunked gum trees, then a picnic clearing on the homecoming page."], ["birdcolours", "How the Birds Got Their Colours", "Gum country with colourful wildflowers, the earth and flowers echoing the birds' painting story."], ["magicpudding", "The Magic Pudding", "A checked picnic cloth among gum trees, a modest hut where the tale needs it, and a flowering garden at the end."], ["tiddalik", "Tiddalik the Frog", "Flowered waterhole, dry rocky gathering ground after the water is swallowed, then the return of the waterhole setting."], ["greatrace", "The Great Race", "River crossing framed by colourful race pennants and a finish-bank platform; the crossing channel stays open."], ["maliang", "The Magic Paintbrush", "One open painting workshop, shelves and paint pots instead of two repeated houses; the boat scene keeps its sea setting."], ["weaver", "The Weaver and the Cowherd", "Cloud court, modest earth home and woven-colour table, then a starry meeting setting for the magpie bridge."], ["nian", "Nian and the New Year", "One court home rather than two copies, blossom trees, bunting and red/gold lanterns; night skies remain with readable characters."], ["kongrong", "Kong Rong Shares the Pears", "A single court home with pear-bearing trees and a fruit table, rather than a pair of identical village houses."], ["change", "Chang'e and the Moon", "Pale lunar setting and coloured star details, with a lantern-and-blossom family festival on the sharing page."], ["crow", "The Thirsty Crow", "Sunlit dry plain and warm rocks, leaving the crow, jug and pebbles unobstructed."], ["lionrabbit", "The Lion and the Rabbit", "Green forest with rounded layered trees and flowers around the clearing; the existing well remains central on the relevant pages."], ["ganesha", "Ganesha and the Mango", "An open domed pavilion and mango-bearing garden, replacing the repeated flat village house; the family and circling action stay in place."], ["bluejackal", "The Blue Jackal", "One open dye workshop with an indigo vat and colour pots, followed by forest clearings; the night-sky cue is preserved."], ["elephantmice", "The Elephants and the Mice", "Warm stone ruins and broken-column silhouettes in an open plain; elephant routes and the rescue nets remain clear."], ["monkey", "The Monkey and the Crocodile", "Tropical fruit trees, a palm and reeds on the far river bank; the fruit-sharing tree and crocodile journey stay central."]];const counts={"duahau": 6, "thanhgiong": 6, "banhchung": 5, "caykhe": 6, "hoguom": 6, "rongtien": 6, "caytre": 6, "tamcam": 6, "sodua": 6, "thachsanh": 6, "chucuoi": 6, "cockien": 6, "vusua": 6, "baluoiriu": 6, "quabau": 6, "thayboi": 6, "nhacmeo": 6, "ongtao": 6, "cachep": 6, "sontinh": 4, "rainbowserpent": 6, "emu": 6, "dotkangaroo": 6, "birdcolours": 6, "magicpudding": 6, "tiddalik": 5, "greatrace": 6, "maliang": 6, "weaver": 6, "nian": 6, "kongrong": 6, "change": 4, "crow": 6, "lionrabbit": 6, "ganesha": 6, "bluejackal": 6, "elephantmice": 6, "monkey": 5};const story=document.querySelector('#story'),device=document.querySelector('#device'),lang=document.querySelector('#lang'),picture=document.querySelector('#picture');stories.forEach(([id,name])=>story.add(new Option(name,id)));function draw(){const id=story.value;document.querySelector('#note').textContent=stories.find(s=>s[0]===id)[2];for(const phase of ['before','after']){const src=`evidence/films-49-${phase}/${device.value}-${lang.value}-${id}-${picture.value}.png`;document.querySelector('#'+phase).src=src;document.querySelector('#'+phase+'Link').href=src;}}function pages(){picture.length=1;for(let k=1;k<=(lang.value==='vi'?1:counts[story.value]);k++)picture.add(new Option('Stage, page '+k,'p'+k));draw();}story.onchange=pages;lang.onchange=pages;device.onchange=draw;picture.onchange=draw;pages();</script></html>
