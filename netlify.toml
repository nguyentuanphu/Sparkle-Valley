# Netlify settings (used for both drag-and-drop and Git deploys).
[build]
  publish = "."

# Small server pieces (Git deploys only; a drag-and-drop zip has none of them):
#   /api/hello        devices counting players, anonymously (netlify/functions/hello.mjs)
#   /studio/api/*     Sparkle Studio online, behind the grown-ups' password (netlify/functions/studio.mjs)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["studio/version.json"]

# Sparkle Studio online: the same dashboard as SparkleStudio.exe (studio/ui), at /studio/
[[redirects]]
  from = "/studio"
  to = "/studio/ui/index.html"
  status = 200
[[redirects]]
  from = "/studio/"
  to = "/studio/ui/index.html"
  status = 200
# the game, as the dashboard's pages load it (the Map and Voices pages read the game's own files)
[[redirects]]
  from = "/studio/game/*"
  to = "/:splat"
  status = 200
[[redirects]]
  from = "/studio/voices/*"
  to = "/voices/:splat"
  status = 200

# The service worker must never be cached, or devices would miss updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    # allow the microphone for the family-voice recorder and online calls; block camera/geolocation
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/studio/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
